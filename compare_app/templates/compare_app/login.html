<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | DataFlow Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include 'compare_app/_theme.html' %}
    <style>
        .auth { max-width: 380px; margin: 56px auto; padding: 0 16px; }
        .auth .brand { color: var(--ink); font-weight: 800; text-decoration: none; font-size: 1.1rem; }
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 60px; }
        .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; user-select: none; }
    </style>
</head>
<body>
<div class="auth">
    <div class="text-center mb-3"><a class="brand" href="{% url 'home' %}">DataFlow Toolkit</a></div>
    <div class="card p-4">
        <h2 class="mb-1" style="font-size:1.25rem;">Sign in</h2>
        <p class="text-muted mb-3">Enter your details to continue.</p>

        {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 mb-3">Invalid username or password. Please try again.</div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Your username" value="{{ form.username.value|default:'' }}" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="id_password">Password</label>
                <div class="pw-wrap">
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Your password" required>
                    <span class="pw-toggle" onclick="togglePw(this)">SHOW</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
    </div>
    <p class="text-center text-muted mt-3 mb-1">New here? <a href="{% url 'register' %}">Create an account</a></p>
    <p class="text-center mb-0"><a href="{% url 'home' %}" class="text-muted">Back to home</a></p>
</div>
<script>
    function togglePw(el) {
        const input = el.parentElement.querySelector('input');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        el.innerText = show ? 'HIDE' : 'SHOW';
    }
</script>
</body>
</html>
