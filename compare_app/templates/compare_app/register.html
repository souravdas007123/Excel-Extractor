<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | DataFlow Toolkit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .auth-card { max-width: 450px; margin: 80px auto; padding: 40px; border: none; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); background: white; }
        .btn-primary { background: #2563eb; border: none; padding: 12px; font-weight: 600; border-radius: 8px; }
        .btn-primary:hover { background: #1d4ed8; }
        .form-control { border-radius: 8px; padding: 10px 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none text-dark fs-4 fw-bold">⚡ DataFlow</a>
                <h3 class="fw-bold mt-4">Create your account</h3>
                <p class="text-muted small">Start cleaning your Excel data for free.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- Django forms ko simple tarike se render karne ke liye -->
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted small">Already have an account? <a href="{% url 'login' %}" class="fw-semibold text-primary text-decoration-none">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
